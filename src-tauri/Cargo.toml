[package]
name = "fast-box"
version = "0.1.0"
description = "Fast Box - Developer Environment Manager"
authors = ["Fast Box Team"]
edition = "2021"

[lib]
name = "fast_box_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "fast-box"
path = "src/main.rs"

[dependencies]
tauri = { version = "2.11.0", features = [] }
tauri-plugin-shell = "2.3.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.12", features = ["json", "stream"] }
tokio = { version = "1", features = ["full"] }
futures-util = "0.3"
tar = "0.4"
zip = "2.0"
xz2 = { version = "0.1", features = ["static"] }
sha2 = "0.10"
thiserror = "1.0"
log = "0.4"
dirs = "5.0"
flate2 = "1.1.9"

[build-dependencies]
tauri-build = { version = "2.4.3", features = [] }
